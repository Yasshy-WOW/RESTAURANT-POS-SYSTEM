[project]
name = "pos-backend"
version = "0.1.0"
description = "簡易POSアプリ バックエンド (FastAPI)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn[standard] (>=0.32.0,<0.33.0)",
    "sqlalchemy (>=2.0.36,<3.0.0)",
    "alembic (>=1.13.3,<2.0.0)",
    "pydantic (>=2.9.2,<3.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "pyjwt (>=2.9.0,<3.0.0)",
    "argon2-cffi (>=23.1.0,<24.0.0)",
    "pymysql (>=1.1.1,<2.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
httpx = "^0.27.2"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    # Optional("X | None")フィールドにField(min_length等)を付けるとpydanticが警告を出すが、
    # これは意図通りの挙動(Noneの場合は制約をスキップし、値がある場合のみ検証する)であり、
    # 実際の不具合ではないため抑制する。
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",
]
